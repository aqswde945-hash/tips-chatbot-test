name: Cloudflare Workers 배포

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci --legacy-peer-deps

      - name: OpenNext 빌드
        run: npm run cf:build

      - name: Vectorize 인덱스 생성 (이미 있으면 무시)
        run: |
          set +e
          OUTPUT=$(npx wrangler vectorize create tips-knowledge --dimensions=768 --metric=cosine 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT" | grep -qiE "already exist|10000|authentication" || exit $EXIT_CODE
            echo "인덱스가 이미 존재합니다. 계속 진행합니다."
          else
            echo "인덱스 생성 완료. 전파 대기 중..."
            sleep 10
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Cloudflare Workers 배포
        run: |
          mv open-next.config.ts _open-next.config.ts.bak
          npx wrangler deploy
          mv _open-next.config.ts.bak open-next.config.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
